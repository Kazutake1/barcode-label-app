name: Recover stuck GitHub Pages deployment (one-time)
on:
  push:
    paths:
      - '.github/workflows/pages-recovery-once.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  cancel-stale-pages-deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the verified stale deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api --method POST "repos/${GH_REPO}/pages/deployments/f1c74940ddf87dfe84ba3a7e447e3e9060858c17/cancel"
