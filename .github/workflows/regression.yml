name: Barcode app regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate browser JavaScript syntax
        run: |
          node --version
          node --check app.js
          node --check sw.js
      - name: Run automated regression and security tests
        run: node --test tests/regression.test.mjs
      - name: Record ZXing release bundle digest for review
        run: |
          tempdir="$(mktemp -d)"
          cd "$tempdir"
          npm pack --ignore-scripts --silent @zxing/browser@0.2.1
          tar -xzf zxing-browser-0.2.1.tgz
          node -e "const fs=require('node:fs'),crypto=require('node:crypto');const hash=crypto.createHash('sha384').update(fs.readFileSync('package/umd/zxing-browser.min.js')).digest('base64');console.log('DECODER_SRI=sha384-'+hash)"
